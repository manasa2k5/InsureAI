<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>InsureAI - Login</title>
</head>

<script>
function showError(message){
    alert(message);
}

function showSuccess(message){
    alert(message);
}
</script>

<body class="auth-container">
<div class="auth-card">
<!-- Logo / Title -->
<div style="text-align: center; margin-bottom: 1.5rem;">
<h1 style="font-size: 2.25rem; font-weight: 700; color: #111827;">InsureAI</h1>
<p style="color: #6b7280; margin-top: 0.5rem;">Smart Insurance Management Platform</p>
</div>

<!-- LOGIN CARD -->
<div id="login-form">
<h2 class="auth-subtitle">Sign In</h2>
<form id="loginForm" class="auth-form">
<div class="form-group">
<label class="form-label">Email</label>
<input type="email" id="loginEmail" class="form-input" required />
</div>
<div class="form-group">
<label class="form-label">Password</label>
<input type="password" id="loginPassword" class="form-input" required />
</div>
<button type="submit" class="btn btn-primary btn-full">Sign In</button>
</form>
<p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: #6b7280;">
<a href="#" id="showRegister" class="auth-link">Create new account</a>
</p>
</div>

<!-- REGISTER CARD -->
<div id="register-form" class="hidden" style="margin-top: 1.5rem;">
<h2 class="auth-subtitle">Create Account</h2>
<form id="registerForm" class="auth-form">
<div class="form-group">
<label class="form-label">Name</label>
<input type="text" id="regName" class="form-input" required />
</div>
<div class="form-group">
<label class="form-label">Email</label>
<input type="email" id="regEmail" class="form-input" required />
</div>
<div class="form-group">
<label class="form-label">Password</label>
<input type="password" id="regPassword" class="form-input" required />
</div>
<div class="form-group">
<label class="form-label">Role</label>
<select id="regRole" class="form-input">
<option value="CUSTOMER">Customer</option>
<option value="AGENT">Agent</option>
<option value="ADMIN">Admin</option>
</select>
</div>
<button type="submit" class="btn btn-primary btn-full">Create Account</button>
</form>
<p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: #6b7280;">
<a href="#" id="showLogin" class="auth-link">Already have an account? Sign in</a>
</p>
</div>

</div>

<script src="app.js"></script>

<script>

// Redirect if already authenticated
if (localStorage.getItem('insureai_token')) {
window.location.href = 'dashboard.html';
}


// LOGIN
document.getElementById('loginForm').addEventListener('submit', async function(e){

e.preventDefault();

const email = document.getElementById('loginEmail').value.trim();
const password = document.getElementById('loginPassword').value;

if(!email || !password){
showError("Enter email and password");
return;
}

try{

await login(email,password);

showSuccess("Login successful");

window.location.href="dashboard.html";

}catch(error){

showError("Login failed: "+error.message);

}

});


// REGISTER
document.getElementById('registerForm').addEventListener('submit', async function(e){

e.preventDefault();

const name = document.getElementById('regName').value.trim();
const email = document.getElementById('regEmail').value.trim();
const password = document.getElementById('regPassword').value;
const role = document.getElementById('regRole').value;

if(!name || !email || !password){

showError("Fill all fields");
return;

}

try{

await register(name,password,email,role);

showSuccess("Registration successful");

document.getElementById("register-form").classList.add("hidden");
document.getElementById("login-form").classList.remove("hidden");

}catch(error){

showError("Registration failed: "+error.message);

}

});


// Toggle forms
document.getElementById('showRegister').onclick=function(e){

e.preventDefault();

document.getElementById("login-form").classList.add("hidden");
document.getElementById("register-form").classList.remove("hidden");

}

document.getElementById('showLogin').onclick=function(e){

e.preventDefault();

document.getElementById("register-form").classList.add("hidden");
document.getElementById("login-form").classList.remove("hidden");

}

</script>

</body>
</html>
