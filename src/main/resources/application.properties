# ==============================
# SERVER CONFIG
# ==============================
server.port=8084


# ==============================
# DATABASE CONFIG
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/insureai_db
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==============================
# JWT CONFIGURATION
# ==============================
jwt.secret=insureai-super-secure-jwt-secret-key-2026-project-security-example
jwt.expirationMs=86400000


# ==============================
# EMAIL CONFIGURATION (OPTIONAL)
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

insureai.notification.email.to=recipient@example.com


# ==============================
# REDIS COMPLETELY DISABLED
# ==============================
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration


# ==============================
# CACHE (USE SIMPLE MEMORY CACHE)
# ==============================
spring.cache.type=simple


# ==============================
# SPRING SECURITY FIX
# ==============================
spring.main.allow-circular-references=true


# ==============================
# LOGGING
# ==============================
logging.level.org.springframework.security=DEBUG


# ==============================
# ACTUATOR
# ==============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always